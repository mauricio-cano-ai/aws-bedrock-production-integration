[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-bedrock-production-integration"
version = "1.0.0"
description = "Sanitized, reproducible AWS Bedrock integration with deterministic idempotency and least-privilege boundaries."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pyright>=1.1.405,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = [
  "src/models.py",
  "src/ports.py",
  "src/service.py",
  "src/http_adapter.py",
]
